project_id = "frank_talk_cards"

[auth]
enabled = true
site_url = "http://localhost:1420"
additional_redirect_urls = ["http://localhost:1420/**"]
enable_signup = true
enable_anonymous_sign_ins = false
jwt_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "60s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Confirm your FrankCards account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your FrankCards password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Your FrankCards sign-in link"
content_path = "./supabase/templates/magic_link.html"
